[package]
name = "rugi"
description = "GPU-accelerated immediate-mode GUI framework for Rust, C and C++."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rugi"

[features]
default = ["winit"]
winit = ["dep:rugi-winit"]

[dependencies]
rugi-core.workspace = true
rugi-text.workspace = true
rugi-theme.workspace = true
rugi-render.workspace = true
rugi-ui.workspace = true
rugi-winit = { workspace = true, optional = true }
wgpu.workspace = true

[dev-dependencies]
pollster.workspace = true

[[example]]
name = "integration"
required-features = ["winit"]

[[example]]
name = "hello"
required-features = ["winit"]
