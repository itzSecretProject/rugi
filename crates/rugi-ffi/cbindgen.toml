language = "C"
include_guard = "RUGI_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
autogen_warning = """/*
 * Rugi — C ABI.
 *
 * GENERATED by cbindgen from crates/rugi-ffi/src. Do not edit by hand.
 * Regenerate with:  RUGI_BLESS_HEADER=1 cargo test -p rugi-ffi header
 *
 * Conventions (see docs/c-abi.md):
 *  - Strings are UTF-8, passed as (pointer, byte length), borrowed for the
 *    duration of the call only. A NULL pointer with length 0 is "".
 *  - Functions returning RugiResult report errors; the thread-local message is
 *    available from rugi_last_error_message(). Widget functions return a
 *    bool and record errors the same way.
 *  - A RugiUi* must only be used on the thread that created it.
 *  - Rust panics never cross this boundary (RUGI_ERROR_PANIC is returned).
 *  - Callbacks must not throw C++ exceptions or longjmp across Rugi frames.
 */"""

[export]
prefix = ""

[enum]
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
